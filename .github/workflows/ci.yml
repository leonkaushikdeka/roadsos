name: RoadSoS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend lint
        run: cd backend && python -m flake8 --max-line-length=120 app/
      - name: Frontend lint
        run: cd frontend && npm install && npm run lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: roadsos_test
          POSTGRES_USER: roadsos
          POSTGRES_PASSWORD: roadsos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Wait for Postgres
        run: sleep 10
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://roadsos:roadsos@localhost:5432/roadsos_test
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t roadsos/backend:latest ./backend
      - name: Build frontend
        run: docker build -t roadsos/frontend:latest ./frontend
      - name: Docker Compose build
        run: docker compose -f infra/docker-compose.yml build