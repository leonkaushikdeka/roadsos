<!-- QR Code Generator for Submission -->
<!-- Open in browser, right-click QR codes → Save as PNG -->
<!DOCTYPE html>
<html>
<head>
  <title>RoadSoS QR Codes</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui; padding: 2rem; background: #0f172a; color: white; }
    .container { display: flex; gap: 3rem; flex-wrap: wrap; }
    .card { text-align: center; }
    input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; }
    canvas { border: 2px solid #dc2626; border-radius: 12px; margin: 1rem 0; }
    h2 { color: #fbbf24; }
  </style>
</head>
<body>
  <h1>🚀 RoadSoS QR Code Generator</h1>
  <p class="subtitle">Save these as PNGs for the submission folder</p>

  <div class="container">
    <div class="card">
      <h2>📱 PWA Link</h2>
      <input id="pwa-url" value="https://roadsos.vercel.app" oninput="generate()" />
      <br/>
      <canvas id="pwa-qr" width="256" height="256"></canvas>
      <p>Tap to install the app</p>
    </div>

    <div class="card">
      <h2>📲 WhatsApp SOS</h2>
      <input id="wa-number" value="+919876543210" oninput="generate()" placeholder="e.g. +919876543210" />
      <br/>
      <canvas id="wa-qr" width="256" height="256"></canvas>
      <p>Send "SOS" to start triage</p>
    </div>
  </div>

  <script>
    function makeQR(canvasId, text) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(qr.createDataURL(8, 0), 0, 0, canvas.width, canvas.height);
    }

    function generate() {
      const pwaUrl = document.getElementById('pwa-url').value;
      const waNumber = document.getElementById('wa-number').value;
      makeQR('pwa-qr', pwaUrl);
      makeQR('wa-qr', 'https://wa.me/' + waNumber.replace('+', '') + '?text=SOS');
    }

    generate();
  </script>
</body>
</html>
